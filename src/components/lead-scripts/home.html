<script>(function(){
  var LEAD_ENDPOINTS = ['/api/lead/', 'https://tpwnpzpuqrgbzislgoif.supabase.co/functions/v1/lead-intake'];


  // Page + time-to-submit context for the back office (bot signal). Best-effort, never blocks a submit.
  var PAGE_LOADED_AT = null;
  try { PAGE_LOADED_AT = Date.now(); } catch (e) { /* no-op */ }

  function addLeadContext(payload){
    try {
      if (typeof location !== 'undefined' && location && typeof location.pathname === 'string') {
        payload.page = location.pathname.slice(0, 200);
      }
    } catch (e) { /* no-op */ }
    try {
      if (PAGE_LOADED_AT !== null) {
        var elapsed = Math.floor(Date.now() - PAGE_LOADED_AT);
        if (isFinite(elapsed) && elapsed >= 0) payload.elapsed_ms = elapsed;
      }
    } catch (e) { /* no-op */ }
  }

  function buildHeroPayload(fields){
    fields = fields || {};
    var payload = {};
    if(fields.name){
      var nameParts = fields.name.trim().split(/\s+/);
      payload.first_name = nameParts.shift() || '';
      if(nameParts.length) payload.last_name = nameParts.join(' ');
    }
    if(fields.email) payload.email = fields.email;
    if(fields.address) payload.property_address = fields.address;
    payload.source = 'home_hero';
    payload.website = fields.website || '';

    // First-touch attribution (see /js/attribution.js) — best-effort, never blocks a submit.
    try {
      var attr = (typeof window !== 'undefined' && window.ppmAttribution) ? window.ppmAttribution() : null;
      if (attr) payload.attribution = attr;
    } catch (e) { /* no-op */ }

    addLeadContext(payload);

    return payload;
  }

  if(typeof module !== 'undefined' && module.exports){
    module.exports = {buildHeroPayload: buildHeroPayload, LEAD_ENDPOINTS: LEAD_ENDPOINTS};
  }

  function postLead(url, payload){
    var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timeoutId = controller ? setTimeout(function(){ controller.abort(); }, 8000) : null;
    return fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
      signal: controller ? controller.signal : undefined
    }).then(function(response){
      if(!response.ok) throw new Error('non-2xx from ' + url);
      return response.json();
    }).then(function(data){
      if(!data || data.ok !== true) throw new Error('not confirmed by ' + url);
      if(timeoutId) clearTimeout(timeoutId);
      return data;
    }, function(err){
      if(timeoutId) clearTimeout(timeoutId);
      throw err;
    });
  }

  function fieldValue(form, name){
    var el = form.querySelector('[name="' + name + '"]');
    return el ? el.value : '';
  }

  function showThankYou(form){if(window.va)va('event',{name:'lead_submit'});
    var note = document.getElementById('lead-error');
    if(note && note.parentNode) note.parentNode.removeChild(note);
    var success = document.getElementById('form-success');
    if(success){
      success.innerHTML = 'Rental analysis requested. We reply within one business day. Want to talk sooner? Call <a href="tel:9733308261" class="text-gold" style="font-weight:700;">(973) 330-8261</a>.';
      success.classList.add('visible');
      form.style.display = 'none';
    } else {
      form.innerHTML = '<p class="hero-form-note" style="font-size:14px;">Rental analysis requested. We reply within one business day. Want to talk sooner? Call <a href="tel:9733308261" class="text-gold" style="font-weight:700;">(973) 330-8261</a>.</p>';
    }
  }

  function showError(form){
    var note = document.getElementById('lead-error');
    if(!note){
      note = document.createElement('p');
      note.id = 'lead-error';
      note.className = 'hero-form-note';
      note.setAttribute('role', 'alert');
      note.style.fontSize = '13px';
      note.style.color = 'rgba(255,255,255,0.9)';
      note.style.marginTop = '8px';
      form.insertAdjacentElement('afterend', note);
    }
    note.innerHTML = 'Something went wrong sending your request — call <a href="tel:9733308261" class="text-gold" style="font-weight:700;">(973) 330-8261</a> or email <a href="mailto:contact@njppm.com" class="text-gold" style="font-weight:700;">contact@njppm.com</a> and we’ll take care of it.';
  }

  function initHeroForm(){
    var form = document.querySelector("form[name='hero-rental-analysis']");
    if(!form) return;

    form.addEventListener('submit', function(e){
      // The legacy #hero-form handler (posted to "/", a Netlify Forms leftover) was removed from
      // the hoisted bundle on 2026-11-03; stopImmediatePropagation stays as a guard in case a
      // cached copy of the old bundle is still in someone's browser.
      if(typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
      e.preventDefault();

      var submitBtn = form.querySelector('button[type="submit"]');
      var originalBtnText = submitBtn ? submitBtn.textContent : '';

      var payload = buildHeroPayload({
        name: fieldValue(form, 'name'),
        email: fieldValue(form, 'email'),
        address: fieldValue(form, 'address'),
        website: fieldValue(form, 'bot-field')
      });

      if(submitBtn){
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending…';
      }

      postLead(LEAD_ENDPOINTS[0], payload).catch(function(){
        return postLead(LEAD_ENDPOINTS[1], payload);
      }).then(function(){
        showThankYou(form);
      }).catch(function(){
        if(submitBtn){
          submitBtn.disabled = false;
          submitBtn.textContent = originalBtnText;
        }
        showError(form);
      });
    });
  }

  // Run immediately: this inline script sits after the form in the document,
  // and registering now (during parse) guarantees our submit listener runs
  // before the legacy module handler, which executes only after parsing.
  initHeroForm();
})();</script>
