<style>
@media(min-width:769px){
  .sticky-cta-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:300;
    background:var(--navy);border-top:1px solid rgba(141,207,221,0.2);
    padding:12px 0;
    display:flex;align-items:center;justify-content:center;gap:24px;
    transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:0 -4px 32px rgba(0,0,0,.4);
  }
  .sticky-cta-bar.visible{transform:translateY(0);}
  .sticky-cta-bar p{font-size:14px;color:rgba(255,255,255,.7);margin:0;}
  .sticky-cta-bar strong{color:var(--white);}
}
@media(max-width:768px){.sticky-cta-bar{display:none!important;}}
</style>
<div class="sticky-cta-bar" id="sticky-cta" role="complementary" aria-label="Quick contact">
  <p><strong>Ready to hand off your NJ rental?</strong> No hidden fees. No markups. Just results.</p>
  <a href="/contact/" class="btn btn-gold" style="min-height:40px;padding:9px 22px;font-size:13px;white-space:nowrap;">Get a Free Rental Analysis</a>
  <a href="tel:{{phone.tel}}" class="btn btn-ghost" style="min-height:40px;padding:9px 18px;font-size:13px;white-space:nowrap;">{{phone.display}}</a>
</div>
<script>
(function(){
  var bar = document.getElementById('sticky-cta');
  if(!bar) return;
  var hero = document.querySelector('.hero');
  var shown = false;
  function onScroll(){
    var heroBottom = hero ? hero.getBoundingClientRect().bottom : 300;
    if(!shown && heroBottom < 0){shown=true;bar.classList.add('visible');}
    else if(shown && heroBottom > 0){shown=false;bar.classList.remove('visible');}
  }
  window.addEventListener('scroll', onScroll, {passive:true});
})();
</script>

<!-- Exit-intent popup (desktop only, once per session) -->
<div class="exit-popup-overlay" id="exit-popup">
<div class="exit-popup">
<button class="exit-popup-close" id="exit-close" aria-label="Close">&times;</button>
<h3>Before you go —</h3>
<p>Get a free rental analysis for your NJ property. No cost, no commitment.</p>
<a href="/contact/" class="btn btn-gold">Get My Free Rental Analysis →</a>
<p style="font-size:12px;color:var(--silver);margin-top:16px;margin-bottom:0;">Or call <a href="tel:{{phone.tel}}" style="color:var(--deep-teal);font-weight:600;">{{phone.display}}</a></p>
</div>
</div>
<script>
(function(){
if(window.innerWidth<769)return;
var shown=false;
document.addEventListener("mouseout",function(e){
if(shown)return;
if(e.clientY>10)return;
if(sessionStorage.getItem("ppm_exit"))return;
document.getElementById("exit-popup").classList.add("visible");
sessionStorage.setItem("ppm_exit","1");
shown=true;
});
document.getElementById("exit-close").addEventListener("click",function(){
document.getElementById("exit-popup").classList.remove("visible");
});
document.getElementById("exit-popup").addEventListener("click",function(e){
if(e.target===this)this.classList.remove("visible");
});
})();
</script>
